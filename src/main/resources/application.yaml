server:
  port: 8000

spring:
  application:
    name: api_gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: user_service
              uri: http://localhost:8001
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: product_service
              uri: http://localhost:8002
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1

            - id: product_categories
              uri: http://localhost:8002
              predicates:
                - Path=/api/categories/**
              filters:
                - StripPrefix=1

            - id: product_vendors
              uri: http://localhost:8002
              predicates:
                - Path=/api/vendors/**
              filters:
                - StripPrefix=1

            - id: order_service
              uri: http://localhost:8003
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1

            - id: order_dashboard
              uri: http://localhost:8003
              predicates:
                - Path=/api/dashboard/**
              filters:
                - StripPrefix=1
